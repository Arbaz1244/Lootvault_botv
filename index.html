<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Vault - Device Verification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, #7f1d1d 0%, #3b0707 45%, #090304 90%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(220, 38, 38, 0.25) 45%, transparent 70%);
      border-radius: 50%;
      top: 8%;
      filter: blur(18px);
      z-index: 0;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.75; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .float-item {
      position: absolute;
      font-size: 24px;
      opacity: 0.75;
      filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.7));
      animation: floatUp 6s ease-in-out infinite;
      z-index: 1;
      user-select: none;
    }
    .f1 { top: 10%; left: 12%; animation-delay: 0s; font-size: 26px; }
    .f2 { top: 15%; right: 14%; animation-delay: 1.5s; font-size: 22px; }
    .f3 { bottom: 14%; left: 10%; animation-delay: 2.5s; font-size: 28px; }
    .f4 { bottom: 12%; right: 12%; animation-delay: 1s; font-size: 24px; }
    .f5 { top: 45%; left: 6%; animation-delay: 3s; font-size: 18px; }
    .f6 { top: 42%; right: 6%; animation-delay: 2s; font-size: 20px; }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(12deg); }
    }

    .card {
      position: relative;
      z-index: 2;
      background: linear-gradient(160deg, rgba(24, 10, 12, 0.92), rgba(10, 5, 6, 0.96));
      border: 2px solid rgba(251, 191, 36, 0.65);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.45), inset 0 0 20px rgba(251, 191, 36, 0.15);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .crown-badge {
      font-size: 44px;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.9));
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #ffffff 15%, #fde047 55%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 15px rgba(245, 158, 11, 0.4);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fca5a5;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .desc {
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);
      color: #140800;
      border: none;
      padding: 15px 22px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.55);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { background: #334155; color: #94a3b8; box-shadow: none; cursor: not-allowed; }

    #status {
      margin-top: 18px;
      font-size: 13.5px;
      color: #fcd34d;
      min-height: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="float-item f1">💎</div>
  <div class="float-item f2">🪙</div>
  <div class="float-item f3">💵</div>
  <div class="float-item f4">💎</div>
  <div class="float-item f5">🪙</div>
  <div class="float-item f6">✨</div>

  <div class="card">
    <div class="crown-badge">👑</div>
    <div class="brand-title">💎 LOOT VAULT 💎</div>
    <div class="subtitle">Security &amp; Device Check</div>
    <p class="desc">Apna account unlock karne aur rewards claim karne ke liye niche button dabakar device verify karein.</p>
    <button id="vbtn" class="btn" onclick="verifyDevice()">🛡️ VERIFY MY DEVICE</button>
    <div id="status">Ready for verification...</div>
  </div>

  <script>
    const WEBHOOK_URL = "https://api.telebotcreator.com/new-webhook?data=gAAAAABrB9iREyKvdXHpy6X_phyafaw2gcv-EILATO-q08mGsK-E6TFMSsMnnjYoUruVUVaaC_5tAFCAJ9icBSyNaXD-2Y2cBVKXk_WmKC_heHclfxGK9nG5Lnk1iwIGyLX2qYPsLtSMRVpCw8ycVsHnjUU8TQBgGa8BrINh5OT6jcNX5mcLzxkNDPP-KVrc1O-AryJNKXK9";
    const BOT_USERNAME = "Lootera_vault_bot";

    async function getFingerprint() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = "top";
      ctx.font = "14px 'Arial'";
      ctx.fillText("LootVault_FP_2026", 2, 2);
      const canvasData = canvas.toDataURL();

      let ip = "noip";
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        ip = data.ip || "noip";
      } catch (e) {}

      const raw = [
        navigator.userAgent,
        screen.width + "x" + screen.height,
        screen.colorDepth,
        navigator.hardwareConcurrency || 0,
        Intl.DateTimeFormat().resolvedOptions().timeZone,
        canvasData.slice(-50),
        ip
      ].join("|");

      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }
      return "dev_" + Math.abs(hash).toString(16) + "_" + ip.replace(/\./g, "");
    }

    async function verifyDevice() {
      const params = new URLSearchParams(window.location.search);
      const uid = params.get("uid");
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("vbtn");

      if (!uid) {
        statusEl.innerHTML = "❌ Invalid Link! Telegram Bot se dubara open karein.";
        return;
      }

      btn.disabled = true;
      statusEl.innerHTML = "⏳ Verifying device...";

      try {
        const devHash = await getFingerprint();
        const payload = JSON.stringify({ uid: uid, dev: devHash });

        // 1. Send via sendBeacon & POST fetch to TBC webhook
        try {
          navigator.sendBeacon(WEBHOOK_URL, payload);
        } catch (e) {}

        fetch(WEBHOOK_URL, {
          method: "POST",
          mode: "no-cors",
          keepalive: true,
          body: payload
        }).catch(() => {});

        statusEl.innerHTML = "✅ <b>Verification Complete!</b><br>Returning to bot in 1 second...";

        // 2. Direct Telegram app deep-link (no web page preview)
        setTimeout(() => {
          window.location.href = "tg://resolve?domain=" + BOT_USERNAME + "&start=v_" + devHash;
        }, 1000);
      } catch (err) {
        statusEl.innerHTML = "❌ Network Error! Internet check karke dubara try karein.";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
