<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Vault - Device Verification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, #7f1d1d 0%, #3b0707 45%, #090304 90%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(220, 38, 38, 0.25) 45%, transparent 70%);
      border-radius: 50%;
      top: 8%;
      filter: blur(18px);
      z-index: 0;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.75; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .float-item {
      position: absolute;
      font-size: 24px;
      opacity: 0.75;
      filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.7));
      animation: floatUp 6s ease-in-out infinite;
      z-index: 1;
      user-select: none;
    }
    .f1 { top: 10%; left: 12%; animation-delay: 0s; font-size: 26px; }
    .f2 { top: 15%; right: 14%; animation-delay: 1.5s; font-size: 22px; }
    .f3 { bottom: 14%; left: 10%; animation-delay: 2.5s; font-size: 28px; }
    .f4 { bottom: 12%; right: 12%; animation-delay: 1s; font-size: 24px; }
    .f5 { top: 45%; left: 6%; animation-delay: 3s; font-size: 18px; }
    .f6 { top: 42%; right: 6%; animation-delay: 2s; font-size: 20px; }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(12deg); }
    }

    .card {
      position: relative;
      z-index: 2;
      background: linear-gradient(160deg, rgba(24, 10, 12, 0.92), rgba(10, 5, 6, 0.96));
      border: 2px solid rgba(251, 191, 36, 0.65);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.45), inset 0 0 20px rgba(251, 191, 36, 0.15);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .crown-badge {
      font-size: 44px;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.9));
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #ffffff 15%, #fde047 55%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 15px rgba(245, 158, 11, 0.4);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fca5a5;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .desc {
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);
      color: #140800;
      border: none;
      padding: 15px 22px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.55);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { background: #334155; color: #94a3b8; box-shadow: none; cursor: not-allowed; }

    #status {
      margin-top: 18px;
      font-size: 13.5px;
      color: #fcd34d;
      min-height: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="float-item f1">💎</div>
  <div class="float-item f2">🪙</div>
  <div class="float-item f3">💵</div>
  <div class="float-item f4">💎</div>
  <div class="float-item f5">🪙</div>
  <div class="float-item f6">✨</div>

  <div class="card">
    <div class="crown-badge">👑</div>
    <div class="brand-title">💎 LOOT VAULT 💎</div>
    <div class="subtitle">Hardware Security Check</div>
    <p class="desc">Apna account unlock karne aur rewards claim karne ke liye niche button dabakar device verify karein.</p>
    <button id="vbtn" class="btn" onclick="verifyDevice()">🛡️ VERIFY MY DEVICE</button>
    <div id="status">Ready for hardware check...</div>
  </div>

  <script>
    const BOT_USERNAME = "Lootera_vault_bot";

    function fnv1a(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return (h >>> 0).toString(16);
    }

    function getWebGLInfo() {
      try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (!gl) return "nogl";
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        const vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
        const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
        return vendor + "~" + renderer + "~" + gl.getParameter(gl.MAX_TEXTURE_SIZE);
      } catch (e) {
        return "glerr";
      }
    }

    async function getAudioHash() {
      try {
        const AudioCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!AudioCtx) return "noaudio";
        const ctx = new AudioCtx(1, 44100, 44100);
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(10000, ctx.currentTime);
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.setValueAtTime(-50, ctx.currentTime);
        comp.knee.setValueAtTime(40, ctx.currentTime);
        comp.ratio.setValueAtTime(12, ctx.currentTime);
        comp.attack.setValueAtTime(0, ctx.currentTime);
        comp.release.setValueAtTime(0.25, ctx.currentTime);
        osc.connect(comp);
        comp.connect(ctx.destination);
        osc.start(0);
        const buf = await ctx.startRendering();
        const data = buf.getChannelData(0);
        let sum = 0;
        for (let i = 4500; i < 5000; i++) {
          sum += Math.abs(data[i]);
        }
        return sum.toFixed(10);
      } catch (e) {
        return "auderr";
      }
    }

    function getCanvasHash() {
      try {
        const c = document.createElement('canvas');
        c.width = 240;
        c.height = 60;
        const ctx = c.getContext('2d');
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "#f60";
        ctx.fillRect(10, 10, 100, 30);
        ctx.fillStyle = "#069";
        ctx.font = "15px Arial";
        ctx.fillText("LootVault_HW_Shield_2026!@#", 12, 32);
        ctx.strokeStyle = "rgba(102, 204, 0, 0.7)";
        ctx.beginPath();
        ctx.arc(60, 30, 20, 0, Math.PI * 2, true);
        ctx.stroke();
        return fnv1a(c.toDataURL());
      } catch (e) {
        return "cnverr";
      }
    }

    async function buildHardwarePayload() {
      const gpu = getWebGLInfo();
      const audio = await getAudioHash();
      const canvas = getCanvasHash();

      const hwCore = [
        gpu,
        screen.width + "x" + screen.height,
        window.devicePixelRatio || 1,
        screen.colorDepth || 24,
        navigator.hardwareConcurrency || 0,
        navigator.maxTouchPoints || 0,
        Intl.DateTimeFormat().resolvedOptions().timeZone || "utc"
      ].join("|");

      const hwFull = hwCore + "|" + canvas + "|" + audio;

      // Two hardware locks: h1 (full GPU+Audio+Canvas) and h2 (core GPU+Screen+CPU)
      const h1 = fnv1a(hwFull);
      const h2 = fnv1a(hwCore);
      return "v_" + h1 + "_" + h2;
    }

    async function verifyDevice() {
      const params = new URLSearchParams(window.location.search);
      const uid = params.get("uid");
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("vbtn");

      if (!uid) {
        statusEl.innerHTML = "❌ Invalid Link! Telegram Bot se dubara open karein.";
        return;
      }

      btn.disabled = true;
      statusEl.innerHTML = "⏳ Scanning hardware signature...";

      try {
        const payload = await buildHardwarePayload();
        statusEl.innerHTML = "✅ <b>Hardware Verified!</b><br>Returning to bot in 1 second...";

        setTimeout(() => {
          window.location.href = "tg://resolve?domain=" + BOT_USERNAME + "&start=" + payload;
        }, 1000);
      } catch (err) {
        statusEl.innerHTML = "❌ Error! Dubara try karein.";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
